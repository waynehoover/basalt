# Publishes the container image the README tells people to run.
#
# Only on a tag. `scripts/release.sh` deliberately does no uploading, tagging or
# publishing, because a script that makes decisions is one you cannot run to see
# what it would do; pushing the tag is the decision, and this is what follows
# from it. The binaries and the plugin bundle are still attached to the release
# by hand from what that script builds.
name: Release

on:
  push:
    # Server tags only. The plugin is released on a bare version tag, because
    # the community directory requires the tag to be exactly the manifest
    # version, and the server has no reason to move when the plugin does: what
    # decides whether the two can talk is the protocol version each carries,
    # not the release number. A `server/v*` tag does not match a `v*` filter,
    # which is what keeps the two apart.
    tags: ["server/v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The docker driver cannot build for several platforms at once; this one
      # can. No QEMU is needed with it, because the Dockerfile cross-compiles
      # rather than emulating: Go needs two environment variables and the final
      # stage is scratch plus a binary, so nothing ever runs on the target arch.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # server/v0.1.4 is not a semver tag as far as this action reads one,
          # so the version is matched out of it. `latest` has to be asked for
          # explicitly here, because it came free with type=semver and does not
          # with type=match.
          tags: |
            type=match,pattern=server/v(\d+\.\d+\.\d+),group=1
            type=match,pattern=server/v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      # An image that was pushed and cannot run is worse than no image, and the
      # tag is already public by the time anyone would notice.
      #
      # The version comes from the metadata step rather than from the git ref:
      # the tag is v0.1.0 and the image is 0.1.0, because semver tagging strips
      # the prefix. Using the ref here asked for an image that does not exist,
      # and the step failed after a successful push, which is the most confusing
      # way for it to be wrong.
      - name: it runs
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} version
