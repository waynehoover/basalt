name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Formatting is checked rather than applied, so a diff never lands as a
      # surprise in somebody else's commit.
      - name: gofmt
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        working-directory: server
        run: go vet ./...

      # The store and the chunk writer are concurrent, and a data race there is
      # the kind of fault that shows up as a lost note rather than a crash.
      - name: test
        working-directory: server
        run: go test -race ./...

      # The systemd unit `basaltd service` prints is a deployment artifact, so
      # it is rendered here and checked by systemd itself rather than by eye.
      # The binary and user are real ones on this runner, because verify
      # checks that ExecStart exists and that User resolves. Skipped, saying
      # so, on a runner without systemd.
      - name: the systemd unit verifies
        working-directory: server
        run: |
          if ! command -v systemd-analyze >/dev/null; then
            echo "systemd-analyze is not on this runner; skipping the unit check"
            exit 0
          fi
          go build -o "$RUNNER_TEMP/basaltd" ./cmd/basaltd
          "$RUNNER_TEMP/basaltd" service \
            -data "$RUNNER_TEMP/basalt-data" -addr 127.0.0.1:3003 \
            -binary "$RUNNER_TEMP/basaltd" -user "$(id -un)" > "$RUNNER_TEMP/basalt.service"
          cat "$RUNNER_TEMP/basalt.service"
          systemd-analyze verify "$RUNNER_TEMP/basalt.service"

  # The compose file is the example people copy, and its whole point is that
  # a pull cannot move you to an image nobody tested. A pin two releases stale
  # is that hazard wearing a seatbelt, and nothing noticed for two releases.
  #
  # Compared against the newest `server/v*` tag, not the plugin's manifest:
  # the image is built on a server tag, so a client-only release moves the
  # plugin while the server correctly stays put. Comparing against the
  # manifest would fail every client-only release for no reason.
  #
  # Older-than fails; equal or newer passes, because the version bump commit
  # lands before the tag that releases it.
  compose-pin:
    name: the compose pin is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: the pinned image is not behind the newest server release
        run: |
          set -euo pipefail
          pinned=$(sed -n 's|.*image: ghcr.io/waynehoover/basalt-sync:\([0-9][^@]*\)@sha256:.*|\1|p' compose.yaml)
          if [ -z "$pinned" ]; then
            echo "could not read a tag@digest pin out of compose.yaml"; exit 1
          fi
          newest=$(git tag --list 'server/v*' | sed 's|server/v||' | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "no server/v* tag in the repository, nothing to compare against"; exit 0
          fi
          echo "compose pins $pinned, newest server release is $newest"
          older=$(printf '%s\n%s\n' "$pinned" "$newest" | sort -V | head -1)
          if [ "$pinned" != "$newest" ] && [ "$older" = "$pinned" ]; then
            echo "compose.yaml pins $pinned but the newest server release is $newest."
            echo "Update the tag and its digest together:"
            echo "  docker buildx imagetools inspect ghcr.io/waynehoover/basalt-sync:$newest"
            exit 1
          fi

          # The runbooks are copied and pasted as readily as the compose file,
          # and docs/server.md went stale in exactly the same way it did.
          stale=$(grep -rn "basalt-sync:[0-9][^@ ]*" docs README.md \
            | grep -v "basalt-sync:$pinned" || true)
          if [ -n "$stale" ]; then
            echo "these name an image tag that is not the pinned $pinned:"
            echo "$stale"
            exit 1
          fi

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The client's tests build cmd/basaltd and talk to it over a real socket,
      # so this job needs both toolchains.
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        working-directory: client
        run: bun install --frozen-lockfile

      # Formatting is checked, never written, because a CI job that rewrites
      # your branch is one you stop trusting. `bun run format` fixes it.
      - name: format
        working-directory: client
        run: bun run format:check

      - name: typecheck
        working-directory: client
        run: bun run typecheck

      - name: test
        working-directory: client
        run: bun run test

      # The sealed-chunk format, byte for byte, under a second runtime. A chunk
      # is named by the hash of its sealed bytes, so a compressor or cipher
      # that differed between Node and Bun would give one chunk two names and
      # dedup would silently stop; the vitest run above checks the same table
      # under Node.
      - name: compression golden, under bun
        working-directory: client
        run: bun run src/core/compression-golden.run.ts

      # A plugin bundle that reaches for a node: builtin compiles, passes every
      # other test, and fails only on a phone.
      - name: build
        working-directory: client
        run: bun run build

  # Its own job so that "the stress suite failed" is a sentence CI can say.
  #
  # Unit tests are necessary here and never sufficient: every real defect in the
  # predecessor was a silent one that only appeared when the system ran, and the
  # four found the week this was written were all of that kind. These kill the
  # server mid-commit, let two devices disagree, and write the filenames people
  # actually have. Linux as well as a laptop, which matters: the server's fsync
  # behaviour is not the same on the two.
  stress:
    name: stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        working-directory: client
        run: bun install --frozen-lockfile

      - name: stress
        working-directory: client
        run: bun run stress

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the image
        run: docker build -t basalt:ci .
      - name: it runs
        run: docker run --rm basalt:ci version

      # compose.yaml is what the docs tell people to run. A file that does not
      # parse is found here rather than on somebody's homelab.
      - name: the compose file is valid
        run: docker compose -f compose.yaml config -q
