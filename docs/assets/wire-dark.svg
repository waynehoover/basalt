<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D4B5C"/></marker></defs>
<text x="0" y="20" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#D7E0EA" text-anchor="start">One line changed in a 2 MiB note</text>
<text x="0" y="40" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#93A3B5" text-anchor="start">What each device sends to the server</text>
<text x="0" y="78" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#D7E0EA" text-anchor="start">Whole-file sync</text>
<text x="0" y="95" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93A3B5" text-anchor="start">sends the file again</text>
<rect x="200" y="62" width="750" height="30" rx="3" fill="#4B5C70"/>
<text x="214" y="82" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#D7E0EA" text-anchor="start">2.0 MiB</text>
<text x="0" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#D7E0EA" text-anchor="start">Basalt</text>
<text x="0" y="147" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93A3B5" text-anchor="start">sends the chunk that moved</text>
<rect x="200" y="114" width="7.9" height="30" rx="1.5" fill="#8FA3B8"/>
<text x="216" y="134" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#D7E0EA" text-anchor="start">21.7 KiB</text>
<path d="M200,150 L200,190" stroke="#3D4B5C" stroke-width="1" />
<path d="M207.9,150 L950,190" stroke="#3D4B5C" stroke-width="1" stroke-dasharray="3 3"/>
<text x="0" y="220" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#D7E0EA" text-anchor="start">the same 21.7 KiB</text>
<text x="0" y="237" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93A3B5" text-anchor="start">magnified 94 times</text>
<rect x="200" y="200" width="438.9" height="30" rx="3" fill="#8FA3B8"/>
<rect x="638.9" y="200" width="311.1" height="30" rx="3" fill="#4B5C70"/>
<rect x="200" y="242" width="10" height="10" rx="2" fill="#8FA3B8"/>
<text x="218" y="251" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#93A3B5" text-anchor="start">12.7 KiB, the chunk that changed</text>
<rect x="638.9" y="242" width="10" height="10" rx="2" fill="#4B5C70"/>
<text x="656.9400921658987" y="251" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#93A3B5" text-anchor="start">9.0 KiB, the entry</text>
<text x="0" y="292" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#93A3B5" text-anchor="start">The entry names every chunk of the new version, so it is most of what a large note costs,</text>
<text x="0" y="310" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#93A3B5" text-anchor="start">and it is what bounds the saving. The gap grows with the file, which is the point.</text>
</svg>
